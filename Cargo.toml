[package]
name = "nanosandbox"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Lightweight cross-platform sandbox for secure code execution"
keywords = ["sandbox", "container", "security", "isolation", "cross-platform"]
categories = ["os::linux-apis", "os::macos-apis", "os::windows-apis", "virtualization", "security"]
repository = "https://github.com/Erio-Harrison/nanosandbox"

[dependencies]
# Error handling
thiserror = "2.0"

# Logging
tracing = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime (for HTTP proxy)
tokio = { version = "1.0", features = ["net", "io-util", "rt-multi-thread", "sync", "macros", "time"] }

[target.'cfg(unix)'.dependencies]
# Unix syscalls
nix = { version = "0.31", features = ["sched", "mount", "signal", "user", "fs", "hostname", "process", "net"] }
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Ask systemd (session D-Bus) to relocate this process into a delegated
# cgroup scope when it isn't already in one — see platform/linux/cgroup.rs.
# Rides on the tokio dependency already required for the network proxy above
# instead of pulling in zbus's own default async-io/polling runtime.
zbus = { version = "5", default-features = false, features = ["blocking-api", "tokio"] }

[target.'cfg(windows)'.dependencies]
# Windows API
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_Security", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3.10"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "sandbox_bench"
harness = false
