[package]
name = "nanosandbox-mcp"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "MCP server (stdio) that runs commands in a nanosandbox sandbox"
repository = "https://github.com/Erio-Harrison/nanosandbox"
readme = "README.md"
keywords = ["mcp", "sandbox", "agent", "security", "isolation"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "nanosandbox-mcp"
path = "src/main.rs"

[dependencies]
nanosandbox = { version = "0.2", path = "../.." }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
