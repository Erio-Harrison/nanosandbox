name: Release Node package

on:
  push:
    tags: ["v*"]

defaults:
  run:
    working-directory: crates/nanosandbox-node

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.cross
        uses: mlugg/setup-zig@v1
        with:
          # "latest" (0.17.0) 404s on every mirror including the official
          # one as of this writing; pin to an established release instead.
          version: "0.13.0"
      - run: npm install
      - run: npm run build -- --target ${{ matrix.target }} ${{ matrix.cross && '--cross-compile' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: crates/nanosandbox-node/*.node
      # index.js/index.d.ts are the generic multi-platform loader/types --
      # identical regardless of which target built them. `napi artifacts`
      # (in the publish job) only ever *updates* an existing one; it won't
      # generate one from nothing, and the publish job's checkout never ran
      # `napi build` itself, so without this the root package silently
      # published with no loader at all (confirmed: that's exactly what
      # went out in the first 0.2.1 publish).
      - if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v4
        with:
          name: node-loader
          path: |
            crates/nanosandbox-node/index.js
            crates/nanosandbox-node/index.d.ts

  publish:
    needs: build
    runs-on: ubuntu-latest
    # napi prepublish creates a GitHub release after each platform package
    # publishes; without this, that call 403s, which napi treats as the
    # whole prepublish step failing and retries -- the retry then 409s for
    # real since the first attempt's publish had actually gone through.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
      - run: npm install
      - run: npx napi create-npm-dirs
      - uses: actions/download-artifact@v4
        with:
          pattern: bindings-*
          # `uses:` steps don't inherit this job's working-directory default
          # (only `run:` steps do), so this must be spelled out relative to
          # the repo root to land where the `run:` steps below expect it.
          path: crates/nanosandbox-node/artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: node-loader
          path: crates/nanosandbox-node
      - run: npx napi artifacts --output-dir artifacts
      # `npm publish` on the root package already runs `napi prepublish -t npm`
      # itself, as package.json's `prepublishOnly` hook -- that's what
      # actually publishes each per-platform package. A second, separate
      # `napi prepublish` step here (there used to be one) meant it ran
      # twice: the lifecycle hook's second pass then re-published packages
      # the first pass had just published seconds earlier, a legitimate 409
      # that looked like registry flakiness but wasn't.
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
