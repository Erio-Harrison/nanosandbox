name: Release Node package

on:
  push:
    tags: ["v*"]

defaults:
  run:
    working-directory: crates/nanosandbox-node

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.cross
        uses: mlugg/setup-zig@v1
        with:
          # "latest" (0.17.0) 404s on every mirror including the official
          # one as of this writing; pin to an established release instead.
          version: "0.13.0"
      - run: npm install
      - run: npm run build -- --target ${{ matrix.target }} ${{ matrix.cross && '--cross-compile' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: crates/nanosandbox-node/*.node

  publish:
    needs: build
    runs-on: ubuntu-latest
    # napi prepublish creates a GitHub release after each platform package
    # publishes; without this, that call 403s, which napi treats as the
    # whole prepublish step failing and retries -- the retry then 409s for
    # real since the first attempt's publish had actually gone through.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
      - run: npm install
      - run: npx napi create-npm-dirs
      - uses: actions/download-artifact@v4
        with:
          pattern: bindings-*
          # `uses:` steps don't inherit this job's working-directory default
          # (only `run:` steps do), so this must be spelled out relative to
          # the repo root to land where the `run:` steps below expect it.
          path: crates/nanosandbox-node/artifacts
          merge-multiple: true
      - run: npx napi artifacts --output-dir artifacts
      # napi prepublish actually publishes each per-platform package itself
      # (confirmed locally -- it's not just a metadata/prep step despite the
      # name); it also updates this package.json's optionalDependencies to
      # point at them. The root package still needs its own `npm publish`.
      - run: npx napi prepublish -t npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
