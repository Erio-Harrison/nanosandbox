name: Release nanosandbox-mcp

# A `v*` tag builds and publishes to npm and PyPI, like the other release
# workflows. (crates.io is crates-release.yml: the core crate goes first.)
# "Run workflow" (workflow_dispatch) builds and packages everything and
# uploads it as artifacts but publishes nothing, to check the pipeline
# without cutting a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

defaults:
  run:
    working-directory: crates/nanosandbox-mcp

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            native: true
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            zig: x86_64-unknown-linux-gnu.2.17
            native: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            zig: aarch64-unknown-linux-gnu.2.17
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.zig
        uses: mlugg/setup-zig@v1
        with:
          version: "0.13.0"
      - if: matrix.zig
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      # Linux binaries are linked against glibc 2.17, so they run on old
      # distributions too, not just ones as new as this runner.
      - if: matrix.zig
        run: cargo zigbuild --release --target ${{ matrix.zig }}
      - if: ${{ !matrix.zig }}
        run: cargo build --release --target ${{ matrix.target }}
      # A binary built for this machine must at least start and answer.
      - if: matrix.native
        run: |
          bin=target/${{ matrix.target }}/release/nanosandbox-mcp
          "$bin" --version
          (printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'; sleep 2) \
            | "$bin" --workspace "$PWD" 2>/dev/null | head -1 | grep -q run_command
      - run: cp target/${{ matrix.target }}/release/nanosandbox-mcp nanosandbox-mcp-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: crates/nanosandbox-mcp/nanosandbox-mcp-${{ matrix.target }}

  npm-packages:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: crates/nanosandbox-mcp/binaries
          merge-multiple: true
      - run: node scripts/make-npm-packages.mjs binaries npm-out
      - name: Pack each package (also proves they are well-formed)
        run: |
          mkdir -p tarballs
          for dir in npm-out/*/; do (cd "$dir" && npm pack --pack-destination ../../tarballs); done
          ls -l tarballs
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: crates/nanosandbox-mcp/npm-out

  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: auto
          - os: ubuntu-latest
            target: aarch64
            manylinux: auto
          - os: macos-latest
            target: x86_64
          - os: macos-latest
            target: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/nanosandbox-mcp
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: ${{ matrix.manylinux }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: crates/nanosandbox-mcp/dist

  publish-npm:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: npm-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: npm-out
      # Platform packages first: the main package depends on them. Skips a
      # version that's already there, so re-running a tag is harmless.
      - run: |
          cd npm-out
          chmod +x */bin/*
          for dir in $(ls | grep -v '^main$') main; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published, skipping"
            else
              (cd "$dir" && npm publish --access public)
            fi
          done
        working-directory: .
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
